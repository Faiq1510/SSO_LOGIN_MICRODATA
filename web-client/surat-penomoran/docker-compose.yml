services:
  # ----------------------------------------------------------------------------
  # Laravel PHP-FPM Application Service
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: surat_penomoran_app
    restart: always
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - /var/www/html/node_modules
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-surat_penomoran}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WA_SERVER_URL=http://wa-server:3000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - surat_network

  # ----------------------------------------------------------------------------
  # Nginx Web Server Service
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: surat_penomoran_nginx
    restart: always
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - surat_network

  # ----------------------------------------------------------------------------
  # PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: surat_penomoran_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-surat_penomoran}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-surat_penomoran}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - surat_network

  # ----------------------------------------------------------------------------
  # Node.js WhatsApp Baileys Server Service
  # ----------------------------------------------------------------------------
  wa-server:
    build:
      context: ./wa-baileys-server
      dockerfile: Dockerfile
    container_name: surat_penomoran_wa
    restart: always
    ports:
      - "${WA_HOST_PORT:-3001}:3000"
    volumes:
      - wa_auth_data:/app/auth_info
      - ./storage:/var/www/html/storage:ro
    networks:
      - surat_network

  # ----------------------------------------------------------------------------
  # Redis In-Memory Cache & Session Service
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: surat_penomoran_redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - surat_network

  # ----------------------------------------------------------------------------
  # Adminer Web UI for Database Management
  # ----------------------------------------------------------------------------
  adminer:
    image: adminer:latest
    container_name: surat_penomoran_adminer
    restart: always
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "${DB_GUI_PORT:-8081}:8080"
    depends_on:
      - db
    networks:
      - surat_network

# ------------------------------------------------------------------------------
# Persistent Volumes & Network
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  wa_auth_data:
    driver: local

networks:
  surat_network:
    driver: bridge
