<!doctype html>
<html lang="id" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#16152e" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Microdata Portal App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
      }
      .scrollbar-none::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-none {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body
    class="h-full bg-[#16152e] text-slate-100 flex flex-col relative overflow-x-hidden select-none"
  >
    <!-- Background Decorative Image & Overlay -->
    <div class="fixed inset-0 pointer-events-none z-0">
      <div
        class="absolute inset-0 bg-gradient-to-br from-[#1d1b3c] via-[#16152e] to-[#0c0b1a] opacity-95"
      ></div>
      <div
        class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-indigo-900/30 via-transparent to-transparent"
      ></div>
      <!-- Watermark Brand Text -->
      <div
        class="absolute inset-0 flex items-center justify-center opacity-[0.03] overflow-hidden select-none"
      >
        <span class="text-[18vw] font-black tracking-widest text-white"
          >MICRODATA</span
        >
      </div>
    </div>

    <!-- Main Content Wrapper -->
    <div
      class="relative z-10 flex flex-col h-full justify-between min-h-screen"
    >
      <!-- Topbar Header -->
      <header
        class="w-full px-4 sm:px-6 md:px-12 py-4 md:py-5 flex items-center justify-between gap-4 border-b border-white/10 backdrop-blur-md bg-white/[0.02]"
      >
        <!-- Left: Logo & App Title -->
        <div class="flex min-w-0 items-center gap-3 sm:gap-4">
          <div
            class="p-2 bg-white/10 rounded-xl border border-white/15 shadow-inner"
          >
            <img
              src="/images/microdata-logo.webp"
              alt="Microdata"
              class="h-7 w-auto object-contain"
            />
          </div>
          <span
            class="text-white font-extrabold text-sm sm:text-base md:text-lg tracking-wider uppercase truncate"
            >MICRODATA PORTAL APP</span
          >
        </div>

        <!-- Right: Controls & User Profile -->
        <div class="flex shrink-0 items-center gap-2 sm:gap-3">
          <!-- Live Search Box -->
          <div class="relative w-32 sm:w-44 md:w-56">
            <svg
              class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
              />
            </svg>
            <input
              type="text"
              id="searchInput"
              aria-label="Cari aplikasi"
              placeholder="Search apps..."
              class="w-full bg-white/10 hover:bg-white/15 focus:bg-slate-900/80 text-white placeholder-slate-400 text-xs font-medium pl-9 pr-14 py-2.5 rounded-xl border border-white/15 focus:border-indigo-400 focus:outline-none transition-all"
            />
            <div
              class="absolute right-2.5 top-1/2 -translate-y-1/2 flex items-center gap-1 pointer-events-none"
            >
              <kbd
                class="hidden sm:inline-block bg-white/10 text-[10px] text-slate-300 px-1.5 py-0.5 rounded border border-white/10 font-sans"
                >Ctrl</kbd
              >
              <kbd
                class="hidden sm:inline-block bg-white/10 text-[10px] text-slate-300 px-1.5 py-0.5 rounded border border-white/10 font-sans"
                >K</kbd
              >
            </div>
          </div>

          <!-- Fullscreen Button -->
          <button
            onclick="toggleFullScreen()"
            title="Toggle Fullscreen"
            class="p-2.5 rounded-xl bg-white/10 hover:bg-white/20 border border-white/15 text-slate-200 hover:text-white transition-all"
          >
            <svg
              class="w-4 h-4"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"
              />
            </svg>
          </button>

          <!-- Notification Bell -->
          <button
            title="Notifikasi"
            class="relative p-2.5 rounded-xl bg-white/10 hover:bg-white/20 border border-white/15 text-slate-200 hover:text-white transition-all"
          >
            <svg
              class="w-4 h-4"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"
              />
            </svg>
            <span
              class="absolute top-2 right-2 w-2 h-2 bg-emerald-400 rounded-full animate-pulse"
            ></span>
          </button>

          <!-- User Dropdown Menu -->
          <div class="relative">
            <button
              id="userMenuBtn"
              class="flex items-center gap-2 bg-white/10 hover:bg-white/20 border border-white/15 text-white font-semibold text-xs md:text-sm px-4 py-2 rounded-xl transition-all shadow-md"
            >
              <span>{{USER_NAME}}</span>
              <svg
                class="w-4 h-4 text-slate-300"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M19 9l-7 7-7-7"
                />
              </svg>
            </button>

            <!-- Dropdown Popover -->
            <div
              id="userDropdown"
              class="hidden absolute right-0 mt-2 w-56 bg-[#1f1d3d] border border-white/15 rounded-2xl shadow-2xl p-3 z-50 backdrop-blur-2xl"
            >
              <div class="px-3 py-2 border-b border-white/10 mb-2">
                <p class="text-xs font-bold text-white uppercase truncate">
                  {{USER_NAME}}
                </p>
                <p class="text-[11px] text-slate-400 truncate">
                  {{USER_EMAIL}}
                </p>
              </div>
              <form method="POST" action="/logout" class="m-0">
                <button
                  type="submit"
                  class="w-full flex items-center gap-2 px-3 py-2 rounded-xl text-xs font-semibold text-rose-300 hover:bg-rose-500/20 transition-all"
                >
                  <svg
                    class="w-4 h-4"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
                    />
                  </svg>
                  Sign Out
                </button>
              </form>
            </div>
          </div>
        </div>
      </header>

      <!-- Sub-Header Taglines -->
      <div
        class="w-full px-4 sm:px-6 md:px-12 pt-5 md:pt-6 pb-2 flex items-center justify-between text-xs font-medium text-slate-400"
      >
        <div>Bridging Apps, Building Futures</div>
        <div class="hidden md:block">
          Leading Integrated Identity & SSO Solution
        </div>
      </div>

      <!-- Main Container -->
      <main
        class="w-full px-4 sm:px-6 md:px-12 my-auto py-4 flex flex-col justify-center"
      >
        <!-- App Cards Horizontal Slider Container -->
        <div class="relative group/slider">
          <!-- Left Navigation Scroll Button -->
          <button
            type="button"
            id="slideLeft"
            aria-label="Geser aplikasi ke kiri"
            class="absolute left-1 sm:-left-4 top-1/2 -translate-y-1/2 z-30 p-2.5 sm:p-3 rounded-full bg-slate-900/90 text-white border border-white/20 backdrop-blur-md transition-opacity shadow-2xl hover:scale-110 disabled:opacity-30 disabled:pointer-events-none"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2.5"
                d="M15 19l-7-7 7-7"
              />
            </svg>
          </button>

          <!-- Horizontal Cards Track (Slidable Left & Right) -->
          <div
            id="cardsTrack"
            tabindex="0"
            aria-label="Daftar aplikasi"
            class="flex justify-start gap-4 sm:gap-5 md:gap-6 overflow-x-auto snap-x snap-mandatory scrollbar-none scroll-smooth pb-4 pt-2 px-1 cursor-grab active:cursor-grabbing select-none touch-pan-x"
          >
            {{CARDS}} {{EMPTY_STATE}}
          </div>

          <!-- Right Navigation Scroll Button -->
          <button
            type="button"
            id="slideRight"
            aria-label="Geser aplikasi ke kanan"
            class="absolute right-1 sm:-right-4 top-1/2 -translate-y-1/2 z-30 p-2.5 sm:p-3 rounded-full bg-slate-900/90 text-white border border-white/20 backdrop-blur-md transition-opacity shadow-2xl hover:scale-110 disabled:opacity-30 disabled:pointer-events-none"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2.5"
                d="M9 5l7 7-7 7"
              />
            </svg>
          </button>
        </div>

        <!-- Bottom Horizontal Scroll Progress Indicator -->
        <div class="mt-6 flex justify-center items-center">
          <div
            class="w-16 h-2 bg-white/10 rounded-full p-0.5 border border-white/10 relative overflow-hidden"
          >
            <div
              id="scrollIndicator"
              class="h-full w-8 bg-white rounded-full transition-all duration-150"
            ></div>
          </div>
        </div>
      </main>

      <!-- Footer -->
      <footer
        class="w-full py-4 text-center text-xs text-slate-400 border-t border-white/10 bg-white/[0.01]"
      >
        Copyright &copy; Microdata Identity Portal 2026
      </footer>
    </div>

    <!-- Interactive JavaScript -->
    <script src="/portal.js" defer></script>
  </body>
</html>
