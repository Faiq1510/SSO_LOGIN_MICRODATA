version: "3.8"

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - COOKIES_KEY=${COOKIES_KEY}
      - ADMIN_SESSION_SECRET=${ADMIN_SESSION_SECRET}
      - OIDC_JWKS=${OIDC_JWKS}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN}
      - ISSUER=${ISSUER}

    volumes:
      - ./src:/app/src
      - ./swagger.yaml:/app/swagger.yaml
      - ../frontend:/app/public

    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sso_user -d sso_idp"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - sso_db_data:/var/lib/postgresql/data

volumes:
  sso_db_data:
