name: SSO Backend Limit Test CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test-backend:
    name: Build & Smoke Test SSO Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sso_idp
          POSTGRES_USER: sso_user
          POSTGRES_PASSWORD: sso_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies Backend
        working-directory: backend
        run: npm ci

      - name: Syntax Check JS Files
        working-directory: backend
        run: |
          node --check src/index.js
          node --check src/admin.js
          node --check src/oidc.js
          node --check src/oidc-adapter.js
          node --check src/interaction.js

      - name: Run Database Migration
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: sso_idp
          DB_USER: sso_user
          DB_PASSWORD: sso_password
        run: npm run migrate

      - name: Run Database Seeding
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: sso_idp
          DB_USER: sso_user
          DB_PASSWORD: sso_password
        run: npm run seed:current-data

      - name: Run Smoke Test / Health Check
        working-directory: backend
        env:
          PORT: 3000
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: sso_idp
          DB_USER: sso_user
          DB_PASSWORD: sso_password
          COOKIES_KEY: ci-test-cookies-key-32-chars-long
          ADMIN_SESSION_SECRET: ci-test-admin-session-secret-key
