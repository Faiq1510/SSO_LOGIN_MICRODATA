          # Jalankan server di background
          node src/index.js &
          SERVER_PID=$!

          # Tunggu server booting
          sleep 5

          # Uji koneksi ke endpoint root
          curl --fail http://localhost:3000/ || exit 1

          # Uji koneksi ke healthcheck DB
          curl --fail http://localhost:3000/health/db || exit 1

          # Uji endpoint well-known OIDC configuration
          curl --fail http://localhost:3000/oidc/.well-known/openid-configuration || exit 1

          # Matikan server kembali
          kill $SERVER_PID
